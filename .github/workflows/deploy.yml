name: Deploy WorkLog Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worklog-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Check JavaScript
        run: npm run check
      - name: Sync required demonstration data before deployment
        run: bash scripts/sync-r2.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.G_Deploy2026 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.G_account_id }}
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.G_Deploy2026 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.G_account_id }}
